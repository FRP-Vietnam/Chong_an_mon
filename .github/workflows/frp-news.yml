          await fs.writeFile('tin-tuc/index.html',page('Tin tức kỹ thuật FRP và chống ăn mòn','Vật liệu FRP, thi công lớp bọc, kiểm tra chất lượng và hồ sơ công trình tại Việt Nam và quốc tế.',base+'/tin-tuc/',listing));
          const urls=[base+'/',base+'/tin-tuc/',...ordered.map(p=>base+link(p))];
          await fs.writeFile('sitemap-tin-tuc.xml','<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'+urls.map(u=>'<url><loc>'+esc(u)+'</loc></url>').join('')+'</urlset>');
          console.log(ordered.length+' articles rendered');
          FRP_END
          cat > daily-news.mjs <<'FRP_END'
          import fs from 'node:fs/promises';
          const file=new URL('news-data.json',import.meta.url);
          const data=JSON.parse(await fs.readFile(file,'utf8'));
          const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          if(data.posts.some(p=>p.date?.startsWith(day))){console.log('Already published today');process.exit(0);}
          if(!process.env.OPENAI_API_KEY)throw new Error('Configure OPENAI_API_KEY as a repository secret.');
          const domains=['altapm.com','arkema.com','sw-regener.com','ampp.org','astm.org','worldbank.org','adb.org'];
          const allowed=u=>{try{const x=new URL(u);return x.protocol==='https:'&&domains.some(d=>x.hostname===d||x.hostname.endsWith('.'+d));}catch{return false;}};
          const keys=['slug','title','en','keywords','source','lead','body','notes','conclusion','enSummary','reference','focus','seoDescription','question','answer'];
          const schema={type:'object',properties:Object.fromEntries(keys.map(k=>[k,k==='source'?{type:'string',enum:Object.keys(data.sources)}:{type:'string'}])),required:keys,additionalProperties:false};
          const input='Write one original Vietnamese FRP trade-journal article of 500–750 words with an English title, natural English search terms and a 100-word English abstract. Provide focus as one natural Vietnamese search phrase, seoDescription as a distinct factual summary, and question/answer as a specific field question and answer that add information. Integrate focus naturally into the title or article, with no repetitive keyword blocks. Research a concrete industry development, public project, or technical document, prioritizing Vietnam and international comparisons. Use the web search tool. Prefer a named source and clearly distinguish reported facts and editorial application. Never invent events, quotes, tests, supplier involvement, product approvals, project photos, or measured results. Avoid unsupported service limits, chemical handling instructions, or engineering specifications. Reference must be a URL actually cited by your web search. Choose source for topic illustration only. Return strict JSON; slug ASCII lowercase hyphen. Exclude previous topics: '+data.posts.map(x=>x.title).join(' | ')+'. Source keys: '+Object.keys(data.sources).join(', ');
          const res=await fetch('https://api.openai.com/v1/responses',{method:'POST',headers:{Authorization:'Bearer '+process.env.OPENAI_API_KEY,'Content-Type':'application/json'},body:JSON.stringify({model:process.env.OPENAI_NEWS_MODEL||'gpt-5-mini',input,tools:[{type:'web_search',filters:{allowed_domains:domains}}],tool_choice:'required',include:['web_search_call.action.sources'],text:{format:{type:'json_schema',name:'frp_article',strict:true,schema}}}),signal:AbortSignal.timeout(180000)});
          if(!res.ok)throw new Error('Research request failed: HTTP '+res.status);
          const result=await res.json();
          const citations=new Set();
          let output='';
          for(const item of result.output??[]){
           for(const ref of item.action?.sources??[])if(ref.url&&allowed(ref.url))citations.add(ref.url);
           for(const part of item.content??[]){
            if(part.type==='output_text')output+=part.text;
            for(const ref of part.annotations??[])if(ref.url&&allowed(ref.url))citations.add(ref.url);
           }
          }
          const post=JSON.parse(output);
          if(!keys.every(k=>typeof post[k]==='string'&&post[k].trim())||!data.sources[post.source]||!allowed(post.reference)||!citations.has(post.reference)||!/^[-a-z0-9]+$/.test(post.slug)||[post.lead,post.body,post.notes,post.conclusion].join(' ').split(/\s+/).length<450||data.posts.some(p=>p.slug===post.slug||p.title.toLowerCase()===post.title.toLowerCase()))throw new Error('Article failed source, duplicate or length check; nothing published.');
          post.date=new Date().toISOString();
          data.posts.push(post);
          await fs.writeFile(file,JSON.stringify(data,null,2)+'\n');
          console.log('New article ready: '+post.slug);
          FRP_END
          cat > tin-tuc/news.css <<'FRP_END'
          *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f6f8f8;color:#122c3e;font:16px/1.7 'DM Sans',system-ui,sans-serif}.shell{width:min(1160px,calc(100% - 40px));margin:auto}.mast{background:#fff;border-bottom:1px solid #dbe4e8}.bar{display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:1rem}.brand img{display:block;width:140px;height:54px;object-fit:contain}.bar nav{display:flex;gap:clamp(.7rem,3vw,2.1rem);font-weight:650;font-size:.88rem}.bar a,footer a{color:inherit;text-decoration:none}.bar [aria-current]{color:#00695e}.intro{margin:clamp(2rem,5vw,4.3rem) 0 1.35rem}.intro p,.lede{color:#3b5868}.intro p{font-size:1.12rem}.intro h1,.article h1{font-size:clamp(2.05rem,5vw,3.8rem);line-height:1.14;letter-spacing:-.035em;margin:0}.topics{display:flex;flex-wrap:wrap;gap:.55rem;padding:0;margin:0 0 1.8rem;list-style:none}.topics a{display:block;border:1px solid #cbdadf;border-radius:30px;padding:.35rem .78rem;background:white;text-decoration:none;font-size:.88rem}.featured{display:grid;grid-template-columns:1fr 1fr;background:#102e3d;color:#fff;border-radius:16px;overflow:hidden;align-items:stretch}.featured>div{padding:clamp(1rem,4vw,2.5rem)}.featured h2{font-size:clamp(1.4rem,3vw,2.1rem);line-height:1.29;margin:.6rem 0}.featured a{color:inherit}.featured p{color:#d7e5ea}.featured .meta{color:#c9e2e6}.featured .visual{border-radius:0;align-self:stretch}.featured .visual-grid{min-height:100%;display:grid;place-items:center}.section-title{margin:2.45rem 0 1rem;font-size:1.6rem}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.15rem;padding:0;list-style:none}.card{background:white;border:1px solid #dce5e8;border-radius:12px;overflow:hidden}.card-content{padding:1.1rem}.card h2{margin:.55rem 0;font-size:1.08rem;line-height:1.42}.card p{font-size:.91rem;color:#405d6e;margin:.5rem 0 1rem}.card a,.featured h2 a{text-decoration:none}.meta{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;font-size:.78rem;font-weight:700;color:#286467}.meta span+span:before,.meta time:before{content:'·';margin-right:.65rem;color:inherit}.more{font-size:.86rem;font-weight:750}.more span{margin-left:.3rem}a{color:#075f69;text-underline-offset:.18em}a:hover{text-decoration:underline}.visual{--deep:#164957;--mid:#0a5c60;--line:#8fe2d0;color:#fff;margin:0;overflow:hidden;border-radius:12px;background:var(--deep)}.theme-1{--deep:#263b57;--mid:#314f72;--line:#b8d8fb}.theme-2{--deep:#24454a;--mid:#2a6057;--line:#b0edc6}.theme-3{--deep:#203957;--mid:#2a5279;--line:#abd7ff}.theme-4{--deep:#4e3e36;--mid:#684d3d;--line:#f9d0a0}.visual-grid{background:radial-gradient(circle at 90% 15%,var(--mid),transparent 52%),repeating-linear-gradient(0deg,transparent,transparent 19px,#ffffff14 20px),repeating-linear-gradient(90deg,transparent,transparent 19px,#ffffff14 20px);padding:clamp(.8rem,3vw,1.7rem)}.visual ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.55rem;width:100%}.visual li{display:flex;flex-direction:column;gap:.25rem;min-width:0;border-top:2px solid var(--line);background:#071d2f80;padding:.6rem .55rem;font-size:clamp(.75rem,1.6vw,1rem);line-height:1.35;overflow-wrap:anywhere}.visual li span{font-size:.74rem;letter-spacing:.08em;color:var(--line)}.visual figcaption{padding:.65rem 1rem;font-size:.8rem;color:#e7f1f2}.card .visual{border-radius:0}.card .visual li{font-size:.73rem}.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:1rem;margin-bottom:3rem}.topic-index{background:white;border:1px solid #dce5e8;padding:.8rem 1rem;border-radius:.6rem;scroll-margin-top:1rem}.topic-index h3{margin:.3rem 0}.topic-index ul{padding-left:1.2rem;font-size:.88rem}.article{max-width:1040px}.crumb{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.5rem 0;font-size:.86rem}.article-head{max-width:900px}.article h1{margin:.65rem 0}.lede{font-size:clamp(1rem,2vw,1.28rem);margin:0 0 1.4rem}.article-head .visual-grid{padding:clamp(1rem,5vw,2.6rem)}.article-grid{display:grid;grid-template-columns:minmax(0,690px) minmax(160px,1fr);gap:2rem;margin:2rem 0}.prose{min-width:0}.prose section{scroll-margin-top:1rem}.prose h2{font-size:1.33rem;line-height:1.35;margin:1.65rem 0 .55rem}.prose section:first-child h2{margin-top:0}.prose p{margin:.4rem 0 1rem}.toc{align-self:start;border:1px solid #dbe5e8;border-radius:.7rem;background:white;padding:.9rem;font-size:.84rem}.toc h2{font-size:1rem;margin:0}.toc ul{margin:.4rem 0;padding-left:1.15rem}.toc li{margin:.25rem 0}.checklist,.english{background:#eaf4f3;border-left:3px solid #2a7c78;padding:1rem 1rem 1rem 1.6rem}.english h2{margin-top:0;font-size:1rem}.related{border-top:1px solid #dbe5e8;margin:2rem 0 3rem}.related ul{padding-left:1.2rem}footer{padding:1.25rem 0;background:#102e3d;color:#eaf5f5}footer .shell{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.85rem}:focus-visible{outline:2px solid #0a8190;outline-offset:3px}@media(max-width:840px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.article-grid{gap:1.25rem}}@media(max-width:620px){.shell{width:calc(100% - 28px)}.bar{min-height:60px}.brand img{width:105px;height:44px}.bar nav{font-size:.75rem}.featured,.cards,.article-grid{grid-template-columns:1fr}.article-grid .toc{grid-row:1}.intro h1,.article h1{letter-spacing:-.02em}.featured .visual-grid{min-height:auto}}
          FRP_END
      - name: Research and generate
        if: github.event_name == 'schedule' || inputs.generate_article == true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_NEWS_MODEL: ${{ vars.OPENAI_NEWS_MODEL }}
        run: node daily-news.mjs
      - name: Build static pages
        run: node build-news.mjs
      - name: Save article history
        run: |
          git add news-data.json
          if ! git diff --cached --quiet; then
            git -c user.name='FRP News' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish sourced FRP article'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir -p /tmp/frp-site
          git archive HEAD | tar -x -C /tmp/frp-site
          rm -rf /tmp/frp-site/.github
          rm -f /tmp/frp-site/{news-data.json,daily-news.mjs,build-news.mjs,HUONG-DAN-TIN-TUC.md}
          cp -R tin-tuc /tmp/frp-site/
          cp sitemap-tin-tuc.xml /tmp/frp-site/
          cat > /tmp/frp-news-nav.cjs <<'FRP_END'
          const fs=require('node:fs');const base='/tmp/frp-site/';
          const html=fs.readFileSync(base+'index.html','utf8');
          const nav=html.replace(/href="#\/tin-tuc"/g,'href="/tin-tuc/"');
          if(!nav.includes('href="/tin-tuc/"'))throw new Error('Không tìm thấy liên kết Tin tức trong index.html hiện tại.');
          fs.writeFileSync(base+'index.html',nav);
          const robot=base+'robots.txt';
          const sitemap='Sitemap: https://giaiphapcompositefrp.com/sitemap-tin-tuc.xml';
          const existing=fs.existsSync(robot)?fs.readFileSync(robot,'utf8'):'User-agent: *\nAllow: /\n';
          if(!existing.split(/\r?\n/).includes(sitemap))fs.writeFileSync(robot,existing.trimEnd()+'\n'+sitemap+'\n');
          FRP_END
          node /tmp/frp-news-nav.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/frp-site
      - uses: actions/deploy-pages@v4
        id: deploy
