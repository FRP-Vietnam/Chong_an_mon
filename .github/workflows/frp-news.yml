          const details=p=>'<div class="meta"><span>'+esc(category(p))+'</span><span>'+readtime(p)+' phút đọc</span>'+(p.date&&Number.isFinite(Date.parse(p.date))?'<time datetime="'+esc(p.date)+'">'+esc(datefmt.format(new Date(p.date)))+'</time>':'')+'</div>';
