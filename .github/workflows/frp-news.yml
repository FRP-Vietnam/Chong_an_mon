              ],
              "ampp": [
                "AMPP · Concrete Surface Preparation",
                "https://www.ampp.org/technical-research/what-is-corrosion/protective-coatings-learning-center/concrete-surface-preparation-and-coating-selection",
                "coatings-header"
              ],
              "immersion": [
                "ASTM · D6943",
                "https://store.astm.org/standards/d6943",
                "coatings-header"
              ],
              "holiday": [
                "ASTM · D5162",
                "https://store.astm.org/d5162-00.html",
