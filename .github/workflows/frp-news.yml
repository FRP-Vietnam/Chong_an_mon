          const fs=require('node:fs');const seed=JSON.parse(fs.readFileSync('.frp-news-seed.json','utf8'));const target='news-data.json';
          const old=fs.existsSync(target)?JSON.parse(fs.readFileSync(target,'utf8')):{posts:[],sources:{}};
          const fresh=new Map(seed.posts.map(x=>[x.slug,x]));
          const posts=old.posts.map(x=>fresh.has(x.slug)?{...x,...fresh.get(x.slug)}:x);
          const existing=new Set(posts.map(x=>x.slug));
          for(const x of seed.posts)if(!existing.has(x.slug))posts.push(x);
          fs.writeFileSync(target,JSON.stringify({sources:{...old.sources,...seed.sources},posts},null,2)+'\n');
