name: FRP technical news
on:
  push:
    branches: [main]
    paths: ['.github/workflows/frp-news.yml']
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      generate_article:
        description: Generate a sourced new article before deploying
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: frp-news-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare embedded news files
        run: |
          mkdir -p tin-tuc
          cat > .frp-news-seed.json <<'FRP_END'
          {
            "sources": {
              "alta": [
                "ALTA · Corrosion-resistant FRP",
                "https://www.altapm.com/markets/corrosion-resistant-frp/",
                "corrision-header-large"
              ],
              "sw": [
                "SWANCOR · Chemical Corrosion Guide 2025",
                "https://www.sw-regener.com/file/output/1133/SWANCOR-Chemical-Corrosion-Guide-20251118.pdf",
                "chem-process-header"
              ],
              "pvdf": [
                "Arkema · Kynar PVDF chemical resistance",
                "https://hpp.arkema.com/en/product-families/kynar-fluoropolymer-family/chemical-resistance-fuel-resistance/",
                "chem-process-header"
              ],
              "power": [
                "ALTA · Power Generation",
                "https://www.altapm.com/markets/corrosion-resistant-frp/power-generation/",
                "power-gen-header"
              ],
              "water": [
                "ALTA · Water Treatment",
